[package]
name = "cluttercutter"
version = "0.13.0"
edition = "2021"
publish = false
description = "Lightweight Windows disk-usage browser (Rust port)"

[[bin]]
name = "cluttercutter"
path = "src/main.rs"

[[bin]]
name = "cluttercutter-cli"
path = "src/bin/cli.rs"

# Cross-platform egui frontend (Linux/macOS/Windows). Its own dir under src/bin
# so it can carry submodules; only this binary links eframe.
[[bin]]
name = "cluttercutter-gui"
path = "src/bin/gui/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
# glow (OpenGL) backend only — avoids the wgpu/DirectX dep tree. wayland+x11 are
# no-ops on Windows but let the Linux build pick up both display servers.
eframe = { version = "0.36.1", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

# The Win32 bindings are only needed on Windows (native GUI, FindFirstFileExW,
# MFT, temp discovery). Gating the dependency to cfg(windows) forces a clean
# platform split: any code touching `windows::` must live behind #[cfg(windows)].
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Graphics_Dwm",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
