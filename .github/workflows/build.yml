name: Build

# Notes on triggers:
#  - pull_request / push to main: regular CI checks for every change.
#  - tags v*.*.*: tag pushes built by a human (or a PAT) trigger a build that attaches the exe.
#  - release: created/published: covers the case where release-please publishes a Release using
#    GITHUB_TOKEN — token-created tag pushes do NOT trigger workflows, but the 'release' event
#    fires when the Release object itself is created, so we get a chance to attach the exe.
#  - workflow_dispatch: lets us manually re-run for a given tag from the Actions tab.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build & attach to its Release (e.g. v0.2.0). Leave blank to just build main.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read   # SignPath downloads the build artifact via the Actions API

jobs:
  # Quality gates for the Rust port. Runs in parallel with the build so a
  # formatting/lint/test regression fails fast and visibly.
  rust-checks:
    name: Rust checks (fmt, clippy, test)
    # Skip on release-please's own PR: it only bumps the version/changelog, is
    # merged by a maintainer, and otherwise sits as an "action_required" run on
    # every push to main (needless email noise). A skipped required check still
    # counts as passing, so the release PR stays mergeable.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
        # Note: deliberately not --locked. release-please bumps rust/Cargo.toml via
        # extra-files but not Cargo.lock, so --locked would fail the release PR.
        # The lock self-heals on build; it's committed for reproducibility, not gated.

  build:
    name: Build (Windows)
    # See rust-checks: skip on release-please's own PR to avoid the recurring
    # "action_required" run + email on every push to main.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_dispatch with a tag input, build that tag. Otherwise use the trigger ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref }}

      # ---------- Rust port (the ClutterCutter app, ships as ClutterCutter.exe) ----------

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Compile Rust port
        shell: pwsh
        working-directory: rust
        run: |
          cargo build --release
          if (-not (Test-Path target/release/cluttercutter.exe)) {
            throw "cluttercutter.exe was not produced"
          }
          $size = (Get-Item target/release/cluttercutter.exe).Length
          Write-Host "Built cluttercutter.exe ($size bytes)"

      - name: Stage Rust artifact
        shell: pwsh
        run: |
          # The Rust port is the ClutterCutter app and ships as ClutterCutter.exe.
          Copy-Item rust/target/release/cluttercutter.exe -Destination ClutterCutter.exe -Force

      - name: Smoke test Rust build
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\ClutterCutter.exe" -PassThru
          Start-Sleep -Seconds 3
          if ($p.HasExited) {
            throw "ClutterCutter.exe exited immediately with code $($p.ExitCode)"
          }
          Write-Host "Rust port running: PID=$($p.Id) Title='$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force

      # ---------- Artifact + release upload ----------

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ClutterCutter-${{ github.sha }}
          path: |
            ClutterCutter.exe
          retention-days: 30

      # ---------- Code signing (SignPath Foundation — free, forever, for OSS) ----------
      # Inert until configured: set repo variable ENABLE_SIGNING=true plus the SignPath
      # org/project/policy/artifact-configuration variables and the SIGNPATH_API_TOKEN
      # secret (setup steps in AGENTS.md “Code signing”). Runs only for releases/tags so
      # PR builds stay fast and need no secrets. SignPath signs the uploaded artifact and
      # returns the signed exes into ./signed, which then replace the unsigned root exes
      # so the Release assets (and the winget SHA computed from them) are the signed ones.
      - name: Sign binaries (SignPath)
        id: sign
        if: >-
          vars.ENABLE_SIGNING == 'true' &&
          (github.event_name == 'release' ||
           (github.event_name == 'workflow_dispatch' && inputs.tag != '') ||
           startsWith(github.ref, 'refs/tags/v'))
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace unsigned exes with signed ones
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          Copy-Item signed/ClutterCutter.exe -Destination ClutterCutter.exe -Force
          Write-Host "Replaced the root exe with the SignPath-signed version."

      # ---------- MSI installer (for admins deploying via GPO / SCCM / Intune) ----------
      # Wraps the (signed, if enabled) ClutterCutter.exe into a per-machine MSI:
      #   msiexec /i ClutterCutter.msi /qn   → silent all-users install.
      # Uses a pinned WiX v3 (downloaded, not the runner's preinstalled tooling).
      - name: Build MSI installer (WiX v3)
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          $ver = ($tag -replace '^v', '')
          if ($ver -notmatch '^\d+\.\d+\.\d+') { $ver = '0.0.0' }  # untagged builds
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath wixbin -Force
          # Quote the -d<name>=<value> args so PowerShell passes them to candle intact.
          & wixbin/candle.exe -nologo -arch x64 "-dVersion=$ver" "-dExeSource=ClutterCutter.exe" "-dIconSource=ClutterCutter.ico" msi/ClutterCutter.wxs -o cc.wixobj
          if ($LASTEXITCODE -ne 0) { throw "candle (WiX compile) failed" }
          & wixbin/light.exe -nologo "-sice:ICE38" "-sice:ICE43" "-sice:ICE57" cc.wixobj -o ClutterCutter.msi
          if ($LASTEXITCODE -ne 0) { throw "light (WiX link) failed" }
          if (-not (Test-Path ClutterCutter.msi)) { throw "ClutterCutter.msi was not produced" }
          Write-Host "Built ClutterCutter.msi ($((Get-Item ClutterCutter.msi).Length) bytes) for v$ver"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClutterCutter-msi-${{ github.sha }}
          path: ClutterCutter.msi
          retention-days: 30

      - name: Attach exe + MSI to GitHub Release
        if: |
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.tag != '') ||
          startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClutterCutter.exe
            ClutterCutter.msi
          fail_on_unmatched_files: true
          tag_name: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
